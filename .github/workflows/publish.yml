name: Publish to npm

on:
  # Publish otomatis sudah terjadi di build.yml (job auto-release), langsung
  # setelah tag & GitHub Release dibuat, di job yang sama. Workflow ini
  # dibiarkan sebagai tombol manual cadangan lewat tab Actions kalau perlu
  # publish ulang versi tertentu.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
