name: Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kunci semua run push ke main dalam 1 antrian — mencegah 2 run publish
# berjalan bersamaan (race condition) yang menyebabkan 403 "cannot publish
# over previously published version".
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Sanity check CLI entry
        run: node bin/cli.js --help || node bin/cli.js

  auto-release:
    name: Auto bump, tag, release & publish npm
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cek apakah versi package.json <= versi live di npm
        id: check_npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          # needs_bump=true kalau versi lokal SAMA ATAU LEBIH RENDAH dari versi
          # yang sudah live di npm -- bukan cuma exact match. Exact-match saja
          # rapuh terhadap race condition/propagation delay npm registry: kalau
          # job sebelumnya sudah bump+publish tapi commit ini checkout sebelum
          # sempat lihat versi terbaru, exact-match bisa salah bilang "beda"
          # padahal publish tetap akan 403.
          HIGHER=$(printf '%s\n%s\n' "$LOCAL_VERSION" "$PUBLISHED_VERSION" | sort -V | tail -n1)
          if [ "$HIGHER" = "$PUBLISHED_VERSION" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          fi

      # Kalau versi di package.json belum lebih tinggi dari versi yang sudah
      # live di npm, bump patch otomatis supaya publish tidak pernah 403.
      # Loop (bukan bump sekali) karena histori repo ini sempat punya tag git
      # yang sudah dibuat duluan tapi publish npm-nya gagal di percobaan
      # sebelumnya -- jadi tag & versi npm live bisa tidak sinkron. Terus
      # bump sampai ketemu versi yang TIDAK punya tag git maupun belum live di
      # npm, supaya tidak berhenti di 'tag already exists' seperti sebelumnya.
      - name: Auto-bump patch version bila perlu
        id: bump
        if: steps.check_npm.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin

          for i in 1 2 3 4 5; do
            npm version patch --no-git-tag-version -m "chore: auto bump version to %s [skip ci]"
            NEW_VERSION=$(node -p "require('./package.json').version")
            TAG="v$NEW_VERSION"

            if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
              echo "Tag $TAG sudah ada (dari percobaan sebelumnya), coba versi berikutnya..."
              continue
            fi

            git add package.json package-lock.json
            git commit -m "chore: auto bump version to $NEW_VERSION [skip ci]"
            git tag "$TAG"
            git push origin HEAD:main
            git push origin "$TAG"
            echo "Berhasil bump ke $NEW_VERSION"
            break
          done

      - name: Set versi final
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Buat tag (jika tidak lewat npm version) & GitHub Release
        if: steps.check_npm.outputs.needs_bump == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            git tag "${{ steps.pkg.outputs.tag }}"
            git push origin "${{ steps.pkg.outputs.tag }}"
          fi

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Publish ke npm (dengan retry kalau kena 403 versi bentrok)
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee /tmp/publish.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ] && grep -q "cannot publish over the previously published versions" /tmp/publish.log; then
            echo "Versi bentrok saat publish (kemungkinan race condition) -- bump patch sekali lagi dan retry."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            npm version patch -m "chore: auto bump version to %s [skip ci]"
            git push origin HEAD:main
            git push origin --tags
            npm publish --access public --provenance
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    outputs:
      tag: ${{ steps.pkg.outputs.tag }}

  build-exe:
    name: Build standalone .exe (Windows)
    needs: auto-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package standalone binary
        run: npx @yao-pkg/pkg . --targets node22-win-x64 --output dist-exe/mcp-github-push-win-x64.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-release.outputs.tag }}
          files: dist-exe/mcp-github-push-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
