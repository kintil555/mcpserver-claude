name: Build & Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Kunci semua run push ke main dalam 1 antrian — mencegah 2 run publish
# berjalan bersamaan (race condition) yang menyebabkan 403 "cannot publish
# over previously published version".
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Sanity check CLI entry
        run: node bin/cli.js --help || node bin/cli.js

  auto-release:
    name: Auto bump, tag, release & publish npm
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cek apakah versi package.json sudah pernah dipublish ke npm
        id: check_npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "none")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          fi

      # Kalau versi di package.json belum diubah manual (sama dengan versi
      # yang sudah live di npm), bump patch otomatis supaya publish tidak
      # pernah 403. Kalau developer sudah bump manual, pakai versi itu apa
      # adanya (memungkinkan minor/major bump manual).
      - name: Auto-bump patch version bila perlu
        id: bump
        if: steps.check_npm.outputs.needs_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: auto bump version to %s [skip ci]"
          git push origin HEAD:main
          git push origin --tags

      - name: Set versi final
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Buat tag (jika tidak lewat npm version) & GitHub Release
        if: steps.check_npm.outputs.needs_bump == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            git tag "${{ steps.pkg.outputs.tag }}"
            git push origin "${{ steps.pkg.outputs.tag }}"
          fi

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Publish ke npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    outputs:
      tag: ${{ steps.pkg.outputs.tag }}

  build-exe:
    name: Build standalone .exe (Windows)
    needs: auto-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package standalone binary
        run: npx @yao-pkg/pkg . --targets node22-win-x64 --output dist-exe/mcp-github-push-win-x64.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.auto-release.outputs.tag }}
          files: dist-exe/mcp-github-push-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
